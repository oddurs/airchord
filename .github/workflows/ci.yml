name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests include replaying the captured gesture dataset through the
      # live classifier — the check that catches accuracy regressions.
      - run: npm test
      - run: npm run build:pages

  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      # The harness is a development-only hook, compiled out of production
      # builds — so this has to run against the dev server, not the export.
      - name: Start the dev server
        run: npm run dev > dev.log 2>&1 &
      - name: Wait for it
        run: until curl -sk -o /dev/null https://localhost:9191/; do sleep 2; done
        timeout-minutes: 3
      # Clipping is invisible to every other kind of check: the instrument once
      # shipped clipping 44% of its samples while typechecking and building
      # cleanly. This renders the real signal path and measures it.
      - name: Measure the audio
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          AUDIO_CHECK_URL: https://localhost:9191/
        run: npm run audio
      - if: failure()
        run: cat dev.log
